url = "https://www.linkedin.com/in/ivie-fonner/"


# Projects
[[params.projects]]
name = "Dropheus"
description = "Dropheus is a Browser extention to automatically check if products online are dropshipped"
url = "https://github.com/Charmunks/dropheus-monorepo"

[[params.projects]]
name = "Spaces"
description = "Spaces is a web app that creates secure cloud based development enviorments, accessible through a web browser."
url = "https://github.com/hackclub/spaces"

[[params.projects]]
name = "Love2D WebIDE"
description = "A WebIDE for making, playing, and sharing Love2D games, all from your web browser."
url = "https://github.com/Charmunks/loveweb"

[[params.projects]]
name = "seek.gay"
description = "Private and secure search engine. No accounts, ads, or ai, just search."
url = "https://seek.gay"


# Breadcrumbs
[params.breadcrumbs]
enabled = true
showCurrentPage = true
home = "Home"

