baseURL = 'https://ivie.codes'
languageCode = 'en-us'
title = "Ivie's Island"
theme = 'typo'

[taxonomies]
tag = 'tags'

[params]
description = "Ivie's little slice of the internet"
theme = 'auto'
colorPalette = 'base16-cupcake'
hideHeader = false
faviconPath = "/"

# Collection to display on home
homeCollectionTitle = 'Posts'
homeCollection = 'posts'

# Lists parameters
paginationSize = 100
listSummaries = true
listDateFormat = '2 Jan 2006'

homeIntroTitle = "Hi! I'm Ivie!"
homeIntroContent = """
Hey! You may know me from my online alias "Charmunk". I'm a teenage developer and love to tinker with technology. I've been working with tech since a very young age.

I am primarily a web developer, but I do dabble in games, hardware, and software/ClI's every once in a while. I also love a good sci-fi novel.
"""

# Social Icons
[[params.social]]
name = "github"
url = "https://github.com/Charmunks"

[[params.social]]
